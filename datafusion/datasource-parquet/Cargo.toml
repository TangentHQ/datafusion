[package]
name = "datafusion-datasource-parquet"
description = "datafusion-datasource-parquet"
readme = "README.md"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
arrow = { workspace = true }
arrow-schema = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
datafusion-common = { version = "55.2.0", default-features = false, features = ["object_store", "parquet"] }
datafusion-common-runtime = { version = "55.2.0", default-features = true }
datafusion-datasource = { version = "55.2.0", default-features = false }
datafusion-execution = { version = "55.2.0", default-features = false }
datafusion-expr = { version = "55.2.0", default-features = false }
datafusion-functions = { version = "55.2.0", default-features = false }
datafusion-functions-aggregate-common = { version = "55.2.0", default-features = false }
datafusion-physical-expr = { version = "55.2.0", default-features = false }
datafusion-physical-expr-adapter = { version = "55.2.0", default-features = false }
datafusion-physical-expr-common = { version = "55.2.0", default-features = false }
datafusion-physical-plan = { version = "55.2.0", default-features = true }
datafusion-proto-models = { version = "55.2.0", default-features = false, optional = true }
datafusion-pruning = { version = "55.2.0", default-features = false }
datafusion-session = { version = "55.2.0", default-features = false }
futures = { workspace = true }
itertools = { workspace = true }
log = { workspace = true }
object_store = { workspace = true }
parking_lot = { workspace = true }
parquet = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
chrono = { workspace = true }
criterion = { workspace = true }
datafusion-functions = { version = "55.2.0", default-features = false }
datafusion-functions-nested = { version = "55.2.0", default-features = false }
tempfile = { workspace = true }

# Note: add additional linter rules in lib.rs.
# Rust does not support workspace + new linter rules in subcrates yet
# https://github.com/rust-lang/cargo/issues/13157
[lints]
workspace = true

[lib]
name = "datafusion_datasource_parquet"
path = "src/mod.rs"

[features]
proto = [
    "dep:datafusion-proto-models",
    "datafusion-datasource/proto",
    "datafusion-physical-plan/proto",
]
parquet_encryption = [
    "parquet/encryption",
    "datafusion-common/parquet_encryption",
    "datafusion-execution/parquet_encryption",
]

[[bench]]
name = "parquet_nested_filter_pushdown"
harness = false

[[bench]]
name = "parquet_struct_filter_pushdown"
harness = false

[[bench]]
name = "parquet_metadata_statistics"
harness = false
